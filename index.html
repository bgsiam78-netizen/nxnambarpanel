        startEngine: function() {

                    if(currentP !== this.lastPeriod) {
                        if(this.pendingSig) {

                        }
                        this.lastPeriod = currentP;
                        
                        document.getElementById('period-text').innerText = runningPeriod;
                        this.timerSeconds = 30;
                        
                        this.generateSignal(list, runningPeriod);
                    }
                } catch(e) {}
            }, 1000);
        },

        normal1Signal: function(lastNumber) {
            if (lastNumber >= 5 && lastNumber <= 9) return 'BIG';
            if (lastNumber >= 0 && lastNumber <= 4) return 'SMALL';
            return null;
        },

        pattern1Signal: function(h) {
            let first = h[0];
            let next = h[1];
            if (first === 0) {
                if ([1,3,6,8].includes(next)) return 'BIG';
                if ([0,2,4,5,7,9].includes(next)) return 'SMALL';
                return null;
            } else {
                let cnt = h.filter(x => x === first).length;
                if (cnt <= 1) {
                    if ([1,3,4,6].includes(first)) return 'BIG';
                    if ([2,5,7,8,9].includes(first)) return 'SMALL';
                } else {
                    if ([1,3,4,6].includes(first)) return 'SMALL';
                    if ([2,5,7,8,9].includes(first)) return 'BIG';
                }
                return null;
            }
        },

        pattern2Signal: function(h) {
            if (!h || h.length < 10) return null;
            let first = h[0], second = h[1], last = h[9];
            if (first === 0 || second === 0 || last === 0) return null;
            let diff = Math.abs(first + second - last);
            if (diff >= 0 && diff <= 4) return 'SMALL';
            if (diff >= 5 && diff <= 9) return 'BIG';
            return null;
        },

        generateExactNumber: function(signal) {
            let pool = [];
            
            if (signal === 'BIG') {
                pool = [6, 7, 8, 9];
            } else if (signal === 'SMALL') {
                pool = [1, 2, 3, 4];
            } else {
                return '-';
            }

            let a = pool[Math.floor(Math.random() * pool.length)];
            let b = pool[Math.floor(Math.random() * pool.length)];
            while (b === a) {
                b = pool[Math.floor(Math.random() * pool.length)];
            }
            
            return `${a},${b}`;
        },

        generateSignal: function(list, runningPeriod) {
            let h = list.map(i => parseInt(i.number));
            let top = h[0];
            
            let finalSig = "SKIP";

            if (!this.isRecovery) {
                finalSig = this.normal1Signal(top) || "SKIP";
            } else {
                let p1 = this.pattern1Signal(h);
                let p2 = this.pattern2Signal(h);
                if (p1 && p2 && p1 === p2) {
                    finalSig = p1;
                } else {
                    finalSig = "SKIP";
                }
            }

            this.pendingSig = finalSig;
            this.pendingExactNum = finalSig !== "SKIP" ? this.generateExactNumber(finalSig) : null;
            this.pendingPeriodForLog = runningPeriod.slice(-4);

            let elSig = document.getElementById('main-sig');
            let statusEl = document.getElementById('status-text');
            let exactEl = document.getElementById('exact-num-display');

            elSig.className = 's-res';
            if(finalSig === "SKIP") {
                elSig.innerText = "SKIP";
                elSig.classList.add('c-skip');
                statusEl.innerText = "NO TRADE";
                if (exactEl) exactEl.style.display = 'none';

                elSig.innerText = "BIG";
                elSig.classList.add('big');
                statusEl.innerText = this.isRecovery ? "RECOVERY MODE" : "SERVER CONNECTED";
                if (exactEl) {
                    exactEl.innerText = `[${this.pendingExactNum}]`;
                    exactEl.style.display = 'block';
                }
            } else {
                elSig.innerText = "SMALL";
                elSig.classList.add('small');
                statusEl.innerText = this.isRecovery ? "RECOVERY MODE" : "SERVER CONNECTED";
                if (exactEl) {
                    exactEl.innerText = `[${this.pendingExactNum}]`;
                    exactEl.style.display = 'block';
                }

            let actDir = actualNum >= 5 ? "BIG" : "SMALL";
            let pSig = this.pendingSig;
            let pExact = this.pendingExactNum;
            let logPeriod = this.pendingPeriodForLog || "-";
            
            if(pSig === "SKIP") {
                this.pendingSig = null;
                this.pendingExactNum = null;
                this.pendingPeriodForLog = null;
                return;
            }
            
            let status = "";
            
            if(pSig === actDir) {
                this.lossStreak = 0; 
                this.isRecovery = false;
                
                let numsArray = pExact ? pExact.split(',').map(n => parseInt(n)) : [];
                if (numsArray.includes(actualNum)) {
                    status = "jackpot";
                } else {
                    status = "win";
                }
            } else {
                this.lossStreak++;
                status = "loss";
                if(this.lossStreak >= 3 && !this.isRecovery) {
                    this.isRecovery = true; 
                }
            }

            this.logs.unshift({
                period: logPeriod,
                pred: pSig,
                nums: pExact || '-',
                act: actualNum,
                status: status
            });

            if (this.logs.length > 50) this.logs.pop();
            this.renderLogs();

            this.pendingSig = null;
            this.pendingExactNum = null;
            this.pendingPeriodForLog = null;
        },

        renderLogs: function() {
            let body = document.getElementById('logs-body');
            body.innerHTML = '';
            
            this.logs.forEach(log => {
                let row = document.createElement('div');
                row.className = `log-row ${log.status}`;
                
                let resultText = '';
                if (log.status === 'win') resultText = 'WIN ✅';
                else if (log.status === 'loss') resultText = 'LOSS ❌';
                else if (log.status === 'jackpot') resultText = 'JACKPOT';
                
                row.innerHTML = `
                    <div>${log.period}</div>
                    <div>${log.pred}</div>
                    <div>${log.nums}</div>
                    <div>${log.act}</div>
                    <div>${resultText}</div>
                `;
                
                body.appendChild(row);
            });
        },

        toggleLogs: function() {
            let logsPanel = document.getElementById('logs-panel');
            this.logsVisible = !this.logsVisible;
            logsPanel.style.display = this.logsVisible ? 'block' : 'none';
        },

        hideLogs: function() {
            document.getElementById('logs-panel').style.display = 'none';
            this.logsVisible = false;
        },

        closePanel: function() {
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('logs-panel').style.display = 'none';
            this.logsVisible = false;
        },

        minimizePanel: function() {
            document.getElementById('main-panel').style.display = 'none';
            document.getElementById('logs-panel').style.display = 'none';
            this.logsVisible = false;
        },

        isDragging: false,
        makeDraggable: function(id) {
            const el = document.getElementById(id);
            let initialX, initialY;

            const dragStart = (e) => {
                if(['INPUT', 'BUTTON', 'A', 'I', 'SPAN'].includes(e.target.tagName)) return;
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - el.offsetLeft;
                    initialY = e.touches[0].clientY - el.offsetTop;
                } else {
                    initialX = e.clientX - el.offsetLeft;
                    initialY = e.clientY - el.offsetTop;
                }
                this.isDragging = false;
            };

            const dragMove = (e) => {
                if (initialX == null || initialY == null) return;
                this.isDragging = true;
                e.preventDefault();
                let currentX, currentY;
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }
                
                let maxX = window.innerWidth - el.offsetWidth;
                let maxY = window.innerHeight - el.offsetHeight;
                if(currentX < 0) currentX = 0; if(currentX > maxX) currentX = maxX;
                if(currentY < 0) currentY = 0; if(currentY > maxY) currentY = maxY;

                el.style.left = currentX + "px";
                el.style.top = currentY + "px";
            };

            const dragEnd = () => { initialX = null; initialY = null; setTimeout(()=>this.isDragging=false, 50); };

            el.addEventListener('touchstart', dragStart, {passive: false});
            el.addEventListener('touchend', dragEnd);
            el.addEventListener('touchmove', dragMove, {passive: false});
            el.addEventListener('mousedown', dragStart);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('mousemove', dragMove);
        }
    };

    window.onload = () => app.init();
</script>
</body>
</html>
